<!DOCTYPE html>
<html lang="ku" id="html-root" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Menu - Chocolate Sarayi Rania</title>
  <link rel="icon" type="image/png" href="Logo1.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="beige-theme">

  <!-- Top Controls Bar -->
  <div class="top-controls">
    <a href="tel:07510615254" class="btn-top-bar" style="direction: ltr;">
      <i class="fa-solid fa-phone"></i>
      <span>0751 061 5254</span>
    </a>

    <div class="top-left-group">
      <button class="btn-top-bar" onclick="openFeedbackModal()">
        <i class="fa-solid fa-comment-dots"></i>
        <span id="feedback-btn-label">ڕاوبۆچوون</span>
      </button>

      <div class="lang-dropdown-wrapper">
        <button class="btn-top-bar" onclick="toggleLangMenu()">
          <i class="fa-solid fa-language"></i>
          <span id="current-lang-text">KU</span>
        </button>
        <div class="lang-dropdown" id="lang-dropdown">
          <div class="lang-option" onclick="changeLanguage('ku')">کوردی</div>
          <div class="lang-option" onclick="changeLanguage('en')">English</div>
          <div class="lang-option" onclick="changeLanguage('ar')">عربي</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Header Banner with Sub-Tabs -->
  <div class="header-banner">
    <img src="logo1.png" alt="Logo" class="top-logo" />
    <h1 class="brand-name">Chocolate Sarayi Rania</h1>
    
    <div class="nav-bar" id="nav-bar">
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <h2 class="nav-title" id="nav-title">مینۆی خواردن</h2>
    </div>

    <div id="sub-tabs-wrapper" class="sub-tabs-container"></div>
  </div>

  <!-- Dynamic Content Area -->
  <div id="view-container" class="menu-section"></div>

  <!-- Floating Cart Bar & Modals -->
  <div id="cart-bar" class="cart-bar" style="display: none;" onclick="openCartModal()">
    <div class="cart-bar-left">
      <div class="cart-badge" id="cart-count">0</div>
      <div class="cart-title" id="cart-bar-label">بڕگە هەڵبژێردراوەکان</div>
    </div>
    <div class="cart-price" id="cart-total-price">0 IQD</div>
  </div>

  <div id="cart-modal-overlay" class="modal-overlay" onclick="closeCartModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">دیاریکراوەکانی تۆ</h3>
        <button class="close-modal-btn" onclick="closeCartModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="cart-items-list"></div>
      <div class="modal-footer">
        <div class="cart-modal-summary">
          <span id="modal-total-label">کۆی گشتی:</span>
          <span id="modal-total-price" style="color:#8b4513;">0 IQD</span>
        </div>
        <button class="cart-clear-btn" onclick="clearCart()" id="modal-clear-btn">سڕینەوەی گشتی</button>
      </div>
    </div>
  </div>

  <!-- Feedback Modal Overlay -->
  <div id="feedback-modal-overlay" class="modal-overlay" onclick="closeFeedbackModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title" id="feedback-modal-title">تێبینی و هەڵسەنگاندن</h3>
        <button class="close-modal-btn" onclick="closeFeedbackModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="rating-group">
          <div class="rating-label" id="lbl-staff">کارمەندان (Staff)</div>
          <div class="stars-container" id="stars-staff">
            <button class="star-btn" onclick="setRating('staff', 1)"><i class="fa-solid fa-star"></i></button>
            <button class="star-btn" onclick="setRating('staff', 2)"><i class="fa-solid fa-star"></i></button>
            <button class="star-btn" onclick="setRating('staff', 3)"><i class="fa-solid fa-star"></i></button>
            <button class="star-btn" onclick="setRating('staff', 4)"><i class="fa-solid fa-star"></i></button>
            <button class="star-btn" onclick="setRating('staff', 5)"><i class="fa-solid fa-star"></i></button>
          </div>
        </div>

        <div class="rating-group">
          <div class="rating-label" id="lbl-service">خزمەتگوزاری (Service)</div>
          <div class="stars-container" id="stars-service">
            <button class="star-btn" onclick="setRating('service', 1)"><i class="fa-solid fa-star"></i></button>
            <button class="star-btn" onclick="setRating('service', 2)"><i class="fa-solid fa-star"></i></button>
            <button class="star-btn" onclick="setRating('service', 3)"><i class="fa-solid fa-star"></i></button>
            <button class="star-btn" onclick="setRating('service', 4)"><i class="fa-solid fa-star"></i></button>
            <button class="star-btn" onclick="setRating('service', 5)"><i class="fa-solid fa-star"></i></button>
          </div>
        </div>

        <div class="rating-group">
          <div class="rating-label" id="lbl-hygiene">پاکوخاوێنی (Cleanliness & Hygiene)</div>
          <div class="stars-container" id="stars-hygiene">
            <button class="star-btn" onclick="setRating('hygiene', 1)"><i class="fa-solid fa-star"></i></button>
            <button class="star-btn" onclick="setRating('hygiene', 2)"><i class="fa-solid fa-star"></i></button>
            <button class="star-btn" onclick="setRating('hygiene', 3)"><i class="fa-solid fa-star"></i></button>
            <button class="star-btn" onclick="setRating('hygiene', 4)"><i class="fa-solid fa-star"></i></button>
            <button class="star-btn" onclick="setRating('hygiene', 5)"><i class="fa-solid fa-star"></i></button>
          </div>
        </div>

        <div class="rating-group">
          <div class="rating-label" id="lbl-overall">ئەزموونی گشتی (Overall Experience)</div>
          <div class="emoji-container" id="emojis-overall">
            <button class="emoji-btn" onclick="setEmoji('😡 Very Sad')">😡</button>
            <button class="emoji-btn" onclick="setEmoji('🙁 Sad')">🙁</button>
            <button class="emoji-btn" onclick="setEmoji('😐 Neutral')">😐</button>
            <button class="emoji-btn" onclick="setEmoji('🙂 Happy')">🙂</button>
            <button class="emoji-btn" onclick="setEmoji('😍 Very Happy')">😍</button>
          </div>
        </div>

        <div class="form-row">
          <div class="form-input-group">
            <label id="lbl-table">ژمارەی مێز (Table #)</label>
            <input type="text" id="feedback-table" class="form-input" placeholder="e.g. 5" />
          </div>
          <div class="form-input-group">
            <label id="lbl-phone">ژمارەی پەیوەندی (Contact)</label>
            <input type="tel" id="feedback-phone" class="form-input" placeholder="0750..." />
          </div>
        </div>

        <div class="form-input-group">
          <label id="lbl-comments">تێبینی زیاتر (Comments)</label>
          <textarea id="feedback-comments" class="form-input" placeholder="..."></textarea>
        </div>

        <button class="send-feedback-btn" onclick="sendFeedbackToWhatsApp()">
          <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i>
          <span id="lbl-send-btn">ناردن لە ڕێگەی واتسئاپ</span>
        </button>
      </div>
    </div>
  </div>

  <div class="social-links">
    <a href="https://www.instagram.com/chocolate.sarayi.rania/" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
    <a href="https://www.facebook.com/61563130409299/" target="_blank" class="social-icon"><i class="fa-brands fa-facebook-f"></i></a>
    <a href="https://www.snapchat.com/@chocolatesaray1" target="_blank" class="social-icon"><i class="fa-brands fa-snapchat"></i></a>
  </div>

  <script src="script.js"></script>
  <script>initPage('FOOD_MENU');</script>
</body>
</html>
